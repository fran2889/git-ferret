[build-system]
# 77 is the floor for PEP 639: `license` as an SPDX expression and
# `license-files` are silently ignored by anything older.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-ferret"
version = "0.1.0"
description = "Read-only reporting tool for auditing many local git repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
# 0.13 is the floor, not 0.12: a command annotated `str | None` fails to build
# on 0.12 with "Type not yet supported". 0.13 is also the last release that
# raises click's exceptions rather than its own, which main() accounts for.
dependencies = ["typer>=0.13", "rich>=13", "click>=8.1"]

[project.optional-dependencies]
# Split by tool so a CI job installs only what it runs. There is no `dev`
# umbrella: a self-referential extra (`dev = ["git-ferrat[lint,test]"]`) does
# not resolve for a package that is not on an index yet. `make install`
# asks for all of these at once.
lint = ["ruff~=0.17.1"]
type = ["pyright[nodejs]~=1.1.414"]
test = ["pytest>=8", "pytest-cov>=6"]
build = ["build>=1.3", "twine>=6"]
audit = ["pip-audit>=2.10"]

[project.scripts]
git-ferret = "git_ferret.cli:main"

[tool.setuptools.packages.find]
include = ["git_ferret*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "PLW1510"]

[tool.ruff.lint.per-file-ignores]
# Typer options are declared in parameter defaults by design.
"git_ferret/cli.py" = ["B008"]

[tool.pyright]
include = ["git_ferret", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = false

[tool.coverage.run]
source = ["git_ferret"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# The suite is at 97.9%, so 95 is a floor that catches a real drop without
# failing on the drift between the Python the CI job runs and the one this
# number was measured on.
fail_under = 95
