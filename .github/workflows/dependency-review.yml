name: Dependency Review

on:
    pull_request:
        branches: ['**']

permissions:
    contents: read

jobs:
    dependency-review:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The action authenticates through GitHub's API, not the
                  # checkout. Leave no token in the worktree for it to read.
                  persist-credentials: false
            - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
              with:
                  # A moderate finding is worth stopping for: this package
                  # shells out to git and runs in a directory of the user's
                  # repositories, so a dependency flaw is not cosmetic.
                  fail-on-severity: moderate
