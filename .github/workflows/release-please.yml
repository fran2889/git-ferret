name: Release Please

on:
    push:
        branches:
            - main

permissions:
    contents: read

# Never cancel a release run halfway: a cancelled run can leave a tag with no
# artifacts, which is the state this workflow is built to avoid.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-please:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # GITHUB_TOKEN cannot trigger workflows from the release pull
            # request, so the release app mints this token.
            - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              id: app-token
              with:
                  client-id: ${{ secrets.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-issues: write
                  permission-pull-requests: write

            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
                  token: ${{ steps.app-token.outputs.token }}

            # `release_created` is true only in the run that creates the
            # release, and the workspace is already the tagged merge commit, so
            # no second checkout is needed. A failed build leaves the draft
            # unpublished and re-running does nothing: repair it by hand.
            - uses: ./.github/actions/setup
              if: ${{ steps.release.outputs.release_created }}
              with:
                  extras: build

            - name: Build artifacts
              if: ${{ steps.release.outputs.release_created }}
              run: python -m build

            - name: Check artifacts
              if: ${{ steps.release.outputs.release_created }}
              run: python -m twine check dist/*

            - name: Upload to release
              if: ${{ steps.release.outputs.release_created }}
              run: gh release upload "$TAG" dist/*
              env:
                  TAG: ${{ steps.release.outputs.tag_name }}
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}

            - name: Publish release
              if: ${{ steps.release.outputs.release_created }}
              run: gh release edit "$TAG" --draft=false
              env:
                  TAG: ${{ steps.release.outputs.tag_name }}
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
