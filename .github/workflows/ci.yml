name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: ['**']

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
              with:
                  extras: lint
            # actionlint checks the workflow files themselves: expressions,
            # action inputs, and the shell in run steps. The SHA pins the
            # action release; `version` pins the actionlint binary it runs.
            # pyflakes is off to keep the step free of an extra pip install;
            # the only inline Python in these workflows is the short heredoc
            # in release-please.yml.
            - name: Lint workflows
              uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
              with:
                  version: '1.7.12'
                  pyflakes: false
            - run: make format-check lint check-spdx PYTHON=python

    doc-links:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The action reads the files, not the API. Leave no token in
                  # the worktree.
                  persist-credentials: false
            - name: Check documentation links
              uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
              with:
                  # Offline mode is the default in .lychee.toml: local files and
                  # heading anchors are checked here, remote URLs nightly.
                  args: >-
                      --config .lychee.toml
                      '*.md' docs .github
                  fail: true

    type-check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
              with:
                  extras: type
            - run: make typecheck PYTHON=python

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # The setup action defaults to Python 3.14, the only interpreter
            # requires-python admits. macOS and Windows run in nightly.yml;
            # this job is the Linux gate every pull request has to pass.
            - uses: ./.github/actions/setup
              with:
                  extras: test
            - run: python -m pytest

    coverage:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
              with:
                  extras: test
            - run: make coverage PYTHON=python
            - name: Summarise coverage in the run summary
              run: python scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"
            - name: Upload coverage results
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage-report
                  path: |
                      coverage.xml
                      htmlcov/
                  retention-days: 7

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
              with:
                  extras: build
            - run: make build PYTHON=python
            - name: Smoke-test the wheel
              run: |
                  uv venv .wheel-smoke
                  uv pip install --python .wheel-smoke/bin/python dist/*.whl
                  .wheel-smoke/bin/git-ferret --version
                  .wheel-smoke/bin/git-ferret --help
            - name: Upload distributions
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist
                  path: dist/
                  retention-days: 7

    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
              with:
                  extras: audit
            - name: Audit dependencies
              run: make audit PYTHON=python

    merge-gate:
        runs-on: ubuntu-latest
        if: always()
        needs: [lint, doc-links, type-check, test, coverage, build, audit]
        steps:
            - name: Check for failures
              if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
              run: exit 1
            - run: echo "All required jobs succeeded!"
